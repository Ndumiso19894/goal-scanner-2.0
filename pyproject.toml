[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "goal-scanner-2"
version = "2.0.0"
description = "Evidence-led football market analysis and prediction engine"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff>=0.5"]
[project.scripts]
goal-scanner = "goal_scanner.cli:main"
[tool.setuptools.packages.find]
include = ["goal_scanner*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
