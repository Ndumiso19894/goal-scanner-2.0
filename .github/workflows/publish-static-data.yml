name: Publish Goal Scanner data

on:
  push:
    branches: [feature/android-goal-scanner-pro]
    paths-ignore:
      - "docs/data/**"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goal-scanner-static-publisher
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out scanner branch
        uses: actions/checkout@v4
        with:
          ref: feature/android-goal-scanner-pro
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scanner database
        uses: actions/cache/restore@v4
        with:
          path: data/goal_scanner.sqlite3
          key: goal-scanner-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            goal-scanner-db-

      - name: Install scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"

      - name: Run scans and create static feeds
        run: python scripts/publish_static.py

      - name: Save scanner database for the next scheduled run
        uses: actions/cache/save@v4
        with:
          path: data/goal_scanner.sqlite3
          key: goal-scanner-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish JSON files to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/fixtures.json docs/data/results.json
          if git diff --cached --quiet; then
            echo "Published feeds have not changed."
          else
            git commit -m "chore: refresh Goal Scanner public data"
            git push origin HEAD:feature/android-goal-scanner-pro
          fi
